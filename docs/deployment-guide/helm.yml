This document describes the installation steps required to setup Search in a Kubernetes cluster. 

 Instructions

Configuring helm repository

The packaged version of Helx chart and all its sub-chart dependencies are stored in this github repository, under the docs/ directory.

For working with charts we need to add this git-hub repository into our local helm repositories.

# make sure that the name helx-charts is used here.
$ helm repo add helx-charts https://helxplatform.github.io/helm-charts/
# update the repo
$ helm repo update 
# check if repo pulled charts, this would output  
$ helm search repo helx-charts

Instance installation

The following section describes the steps needed to install an instance of helx. This is done with two installations currently. First installation is the helx chart installation , the second phase is installing the UI (frontend).

During our install we supply two helm values files (one for backend services, one for the frontend) we supply during installation.

helm -n <your-namespace> upgrade --install \
--skip-crds -f <path-to-your-values-file> \
search helx-charts/search



 The --skip-crds, in the first command above is required if your Kubernetes user does not have permissions to create custom resource definitions (CRDs).

 IMPORTANT CHANGE NOTICEPrior to Search Chart version 4.0.0, Helx-chart was used to deploy search. That has changed since. If you have an existing installation using Helx-Chart and would like to keep your data , follow these steps: 1.  helm -n <your-namespace> uninstall <release-name> 2. Make sure all resources are removed except Persistent Volume Claims3. Do the above installation command , using release name from step 1. eg : if you had your previous installation release as helxhelm -n <your-namespace> upgrade --install --skip-crds -f <path-to-your-values-file>  search helx-charts/searchwould be the new installation command. 



Search instance installation



When installing search instance the following components are installed.

Roger, Airflow, redis, elasticsearch, Tranql and Dug api server.

The following values files are provided to make bare minimum installation.

Search Values file
```code yaml
    airflow:
      airflow:
        image:
          tag: "develop"      
        config:
            # AIRFLOW__CLI__ENDPOINT_URL: https://yk-heal.apps.renci.org/airflow
            AIRFLOW__WEBSERVER__BASE_URL: https://yk-heal.apps.renci.org/airflow
            AIRFLOW__KUBERNETES__DELETE_WORKER_PODS: "FALSE"
        users:
          - email: kebedey@renci.org
            firstName: Yaphet
            lastName: Kebede
            password: somePass
            role: Admin
            username: admin
        # Resource config for all task runner pods.
        #kubernetesPodTemplate:
        #  resources:
        #    limits:
        #      cpu: 2
        #      memory: 1G
        #    requests:
        #      cpu: 2
        #      memory: 1G
      dags:
        gitSync:      
          branch: "develop"
    api:
      image:
        repository: containers.renci.org/helxplatform/dug
        tag: "v2.10.0-prerelease12"
        pullPolicy: Always  
      # scale api pods as desired
      replicas: 1
    #elasticsearch:
      # uncomment the following to run just a single elastic search , by default a cluster
      # of three es pods is created.
      #replicas: 1
      #clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"
    
    config:   
        data_source: s3
        # select datasets to ingest , comma seperated values allowed.
        input_sets: crdc:v1.0
        # select graphs to ingest
        kgx_data_sets: baseline-graph,cde-graph
        node_to_queries_enabled: true
        s3:
          # aquire this from dug devs 
          access_key: ***
          bucket: **
          host: ***
          secret_key: ***
    
    
    ingress:
      # Enables Ingress 
      enabled: True  
      hosts:
          # eg : mysite.apps.renci.org
        - host: <your ingress address>
      tls:
       - secretName: <your ingress address>-tls
         hosts:
           - <your ingress address>
    tranql:
      image: containers.renci.org/helxplatform/tranql
      imageTagOverride: 0.4.dev5
    redis-insight:
      # -- Enable/Disable Redis UI
      enabled: True
      # -- Url should be same as public ingress url
      rootUrl: "https://<your ingress address>/redis-insight"
    
    
    ui:
      # Enables UI 
      enabled: true
      config:
        brand_name: heal
        search:
          url: https:\/\/<your ingress address>\/search-api
        tranql_enabled: "true"    
        tranql_url: https:\/\/<your ingress address>\/tranql
        # hide tabs on UI 
        hidden_result_tabs: "cdes"
```  



💡 The above configuration heavily relies on defaults from the following charts Search-chart, Tranql-chart, Airflow-chart(v8.1.3) , Elastic-chart(v7.16) and redis-chart(v15.4.1). For more detailed configuration options, please review the repo's.



🚀 Install Search

# install search
helm -n <your-namespace> install --skip-crds -f search-values.yaml search helx-charts/search




Shared instances values files can be found here : keybase://team/dug_search/Search%20helm%20values
